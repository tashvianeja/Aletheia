name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PRIVACY_GUARDIAN_LLM__ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --frozen
      - name: Install OCR (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract create-dmg
      - name: Install OCR and installer compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract innosetup -y --no-progress
      - name: Install Firefox (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ ! -x /Applications/Firefox.app/Contents/MacOS/firefox ]; then
            brew install --cask firefox
          fi
      - name: Install Firefox (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "C:/Program Files/Mozilla Firefox/firefox.exe")) {
            choco install firefox -y --no-progress
          }
      - run: npm install --prefix build/firefox-tools web-ext@10.6.0
      - run: uv run playwright install chromium
      - run: uv run python scripts/generate_schema.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src/
      - name: Test all acceptance paths
        id: test_gate
        continue-on-error: true
        run: uv run pytest --cov=privacy_guardian --cov-report=xml --cov-report=json --cov-report=term-missing --cov-fail-under=0
      - name: Check line coverage
        id: coverage_gate
        continue-on-error: true
        run: uv run python tests/check_coverage.py coverage.json
      - run: uv run bandit -r src/ -ll
      - run: uv run pip-audit --skip-editable
      - name: Build extension
        run: uv run python scripts/build_extension.py
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: uv run python scripts/build.py mac
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: uv run python scripts/build.py windows
      - name: Packaged macOS smoke
        if: runner.os == 'macOS'
        run: |
          dist/PrivacyGuardian.app/Contents/MacOS/PrivacyGuardian --diagnose
          PRIVACY_GUARDIAN_DATA_DIR="$RUNNER_TEMP/guardian-smoke" dist/PrivacyGuardian.app/Contents/MacOS/PrivacyGuardian --smoke-test
          codesign --verify --deep --strict dist/PrivacyGuardian.app
          uv run python tests/packaging/verify_packaged_installation.py --platform macos --artifact dist/PrivacyGuardian-*.dmg --maximum-macos 13.0
      - name: Packaged Windows smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PRIVACY_GUARDIAN_DATA_DIR = "$env:RUNNER_TEMP/guardian-smoke"
          & dist/PrivacyGuardian/PrivacyGuardian.exe --diagnose
          & dist/PrivacyGuardian/PrivacyGuardian.exe --smoke-test
          $installer = @(Get-ChildItem dist/PrivacyGuardian-Setup-*.exe)
          if ($installer.Count -ne 1) { throw "Expected exactly one installer artifact" }
          uv run python tests/packaging/verify_packaged_installation.py --platform windows --artifact $installer[0].FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-guardian-${{ matrix.os }}
          path: |
            dist/
            coverage.xml
            artifacts/

      - name: Enforce test and coverage outcomes
        if: always() && (steps.coverage_gate.outcome == 'failure' || steps.test_gate.outcome == 'failure')
        run: exit 1
